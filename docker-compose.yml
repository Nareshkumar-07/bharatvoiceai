# BharatVoice AI - full stack
#   cp .env.example .env   (add SARVAM_API_KEY)
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bharatvoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bharatvoice}
      POSTGRES_DB: bharatvoice
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharatvoice -d bharatvoice"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://bharatvoice:${POSTGRES_PASSWORD:-bharatvoice}@db:5432/bharatvoice
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: "false"
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      PUBLIC_BASE_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - recordings:/srv/backend/recordings

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_WS_BASE_URL: ""
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  recordings:
